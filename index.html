<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nav_home">Home</title>
  <meta name="description" content="Teacher Allocation Portal — Saharsa District, Education Department, Government of Bihar." />
  <link rel="icon" href="assets/bihar-emblem.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-lang="en">
  <a class="skip-link" href="#main" data-i18n="nav_home">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <img class="emblem" src="assets/bihar-emblem.png" alt="Government of Bihar / बिहार सरकार" />
      <div class="header-titles">
        <span class="h-main" data-i18n="app_title">Teacher Allocation Portal</span>
        <span class="h-sub" data-i18n="app_subtitle">Saharsa District, Government of Bihar</span>
      </div>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <div class="lang-toggle" role="group" aria-label="Language / भाषा">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="hi" aria-pressed="false">हिंदी</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="site-nav" aria-label="Primary">
    <div class="nav-inner">
      <a href="index.html"   data-nav="home"    data-i18n="nav_home">Home</a>
      <a href="teacher.html" data-nav="teacher" data-i18n="nav_teacher">Teacher Portal</a>
      <a href="results.html" data-nav="results" data-i18n="nav_results">Check Result</a>
      <a href="admin.html"   data-nav="admin"   data-i18n="nav_admin">Admin</a>
    </div>
  </nav>

  <main id="main">
    <!-- Welcome hero -->
    <section class="home-hero" aria-labelledby="hero-heading">
      <img class="home-hero-emblem" src="assets/bihar-emblem.png" alt="" />
      <div class="home-hero-titles">
        <h2 id="hero-heading" data-i18n="home_hero_title">Welcome</h2>
        <div class="h-sub" data-i18n="app_subtitle">Saharsa District, Government of Bihar</div>
        <p data-i18n="home_hero_lead"></p>
      </div>
    </section>

    <!-- Action cards -->
    <section class="home-actions" aria-label="Quick actions">
      <a class="home-action-card" href="teacher.html">
        <h3 data-i18n="home_cta_teacher_title"></h3>
        <p data-i18n="home_cta_teacher_desc"></p>
        <span class="home-action-btn" data-i18n="home_cta_teacher_btn"></span>
      </a>
      <a class="home-action-card green" href="results.html">
        <h3 data-i18n="home_cta_result_title"></h3>
        <p data-i18n="home_cta_result_desc"></p>
        <span class="home-action-btn" data-i18n="home_cta_result_btn"></span>
      </a>
      <a class="home-action-card navy" href="admin.html">
        <h3 data-i18n="home_cta_admin_title"></h3>
        <p data-i18n="home_cta_admin_desc"></p>
        <span class="home-action-btn" data-i18n="home_cta_admin_btn"></span>
      </a>
    </section>

    <!-- District stats -->
    <section class="home-stats" aria-label="District at a glance">
      <div class="stat"><div class="num">1</div>   <div class="lbl" data-i18n="home_stat_districts"></div></div>
      <div class="stat"><div class="num">10</div>  <div class="lbl" data-i18n="home_stat_blocks"></div></div>
      <div class="stat"><div class="num">135</div> <div class="lbl" data-i18n="home_stat_panchayats"></div></div>
    </section>

    <!-- About -->
    <section class="home-about">
      <h3 data-i18n="home_about_title"></h3>
      <p data-i18n="home_about_body"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div data-i18n="footer_note"></div>
      <div class="inline-note" data-i18n="footer_disclaimer"></div>
      <div class="inline-note">© <span id="footer-year"></span> · Government of Bihar</div>
    </div>
  </footer>

  <script type="module" src="js/home.js"></script>
</body>
</html>
